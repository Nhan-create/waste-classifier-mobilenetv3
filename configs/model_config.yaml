model:
  name: mobilenet_v3_large
  pretrained: true
  num_classes: 10

input:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation_group: C

training:
  seed: 42
  deterministic: false
  batch_size: 32
  num_workers: 4
  label_smoothing: 0.1
  weight_decay: 0.0001
  phase1:
    epochs: 5
    head_lr: 0.001
  phase2:
    epochs: 25
    backbone_lr: 0.0001
    head_lr: 0.0003
  scheduler: cosine
  gradient_clip: 1.0
  early_stopping_patience: 7

inference:
  confidence_threshold: 0.55
  top_k: 3

checkpoint:
  format_version: 1
